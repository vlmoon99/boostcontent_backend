# Baked into the image (postgres -c hba_file=…) so a restored or replicated data directory gets the same rules.
# Inside the container and the compose network: as the stock image. From the tailnet (the db port is published
# on TAILNET_IP for the standby): streaming replication only, no database logins.
local   all           all                             trust
host    all           all          127.0.0.1/32       trust
host    all           all          ::1/128            trust
local   replication   all                             trust
host    replication   all          127.0.0.1/32       trust
host    replication   all          ::1/128            trust
host    replication   replicator   all                scram-sha-256
host    all           all          100.64.0.0/10      reject
host    all           all          all                scram-sha-256
